[project]
name = "scrape-idealista"
version = "0.1.0"
description = "Selenium notebooks for scraping Idealista Barcelona housing listings for research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "bs4>=0.0.2",
    "fiona>=1.10.1",
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
    "lxml>=5.2.0",
    "matplotlib>=3.10.9",
    "notebook>=7.2.0",
    "pandas>=2.2.0",
    "playwright>=1.58.0",
    "plotly>=6.7.0",
    "requests>=2.33.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "selenium>=4.20.0",
    "shapely>=2.1.2",
    "tqdm>=4.66.0",
    "undetected-chromedriver>=3.5.5",
    "webdriver-manager>=4.0.0",
]

